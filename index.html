<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>Riksan AI — Supreme v5.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --surface2: #18181f;
    --border: rgba(255,255,255,0.07);
    --accent: #7c6aff;
    --accent2: #00e5a0;
    --accent3: #ff6b6b;
    --text: #e8e8f0;
    --text-dim: #6b6b80;
    --user-bg: #1e1b4b;
    --ai-bg: #13131a;
    --font-ui: 'Syne', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-code: 'JetBrains Mono', monospace;
    --radius: 16px;
    --shadow: 0 8px 32px rgba(0,0,0,0.5);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    overflow: hidden;
  }

  /* NOISE TEXTURE */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events: none; z-index: 0;
  }

  /* AMBIENT GLOW */
  body::after {
    content: '';
    position: fixed;
    top: -20%; left: 50%; transform: translateX(-50%);
    width: 60vw; height: 40vh;
    background: radial-gradient(ellipse, rgba(124,106,255,0.08) 0%, transparent 70%);
    pointer-events: none; z-index: 0;
  }

  #app {
    position: relative; z-index: 1;
    display: flex; flex-direction: column;
    height: 100vh; max-width: 820px;
    margin: 0 auto;
  }

  /* HEADER */
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    background: rgba(10,10,15,0.8);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    flex-shrink: 0;
  }

  .logo {
    display: flex; align-items: center; gap: 10px;
    font-family: var(--font-ui);
    font-weight: 800; font-size: 18px;
    letter-spacing: -0.5px;
  }

  .logo-icon {
    width: 34px; height: 34px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    box-shadow: 0 0 20px rgba(124,106,255,0.4);
  }

  .logo-text span { color: var(--accent); }

  .header-badges {
    display: flex; gap: 6px; align-items: center;
  }

  .badge {
    padding: 3px 8px;
    border-radius: 20px;
    font-size: 9px;
    font-family: var(--font-code);
    font-weight: 500;
    letter-spacing: 0.05em;
    border: 1px solid;
  }

  .badge-green { color: var(--accent2); border-color: rgba(0,229,160,0.3); background: rgba(0,229,160,0.07); }
  .badge-purple { color: var(--accent); border-color: rgba(124,106,255,0.3); background: rgba(124,106,255,0.07); }

  /* CHAT AREA */
  #chatArea {
    flex: 1;
    overflow-y: auto;
    padding: 28px 16px;
    scroll-behavior: smooth;
    display: flex; flex-direction: column; gap: 0;
  }

  #chatArea::-webkit-scrollbar { width: 4px; }
  #chatArea::-webkit-scrollbar-track { background: transparent; }
  #chatArea::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

  /* WELCOME */
  #welcome {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; flex: 1;
    text-align: center; padding: 40px 20px;
    gap: 20px;
    animation: fadeUp 0.6s ease;
  }

  .welcome-orb {
    width: 80px; height: 80px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 24px;
    display: flex; align-items: center; justify-content: center;
    font-size: 36px;
    box-shadow: 0 0 40px rgba(124,106,255,0.5), 0 0 80px rgba(124,106,255,0.2);
    animation: pulse 3s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 40px rgba(124,106,255,0.5), 0 0 80px rgba(124,106,255,0.2); }
    50% { box-shadow: 0 0 60px rgba(0,229,160,0.5), 0 0 100px rgba(0,229,160,0.2); }
  }

  .welcome h1 {
    font-family: var(--font-ui);
    font-size: 28px; font-weight: 800;
    letter-spacing: -1px;
    background: linear-gradient(135deg, #fff 30%, var(--accent));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }

  .welcome p {
    color: var(--text-dim); font-size: 14px; line-height: 1.7;
    max-width: 400px;
  }

  .quick-actions {
    display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
    margin-top: 8px;
  }

  .quick-btn {
    padding: 8px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text-dim); font-size: 12px;
    cursor: pointer; transition: all 0.2s;
    font-family: var(--font-body);
  }

  .quick-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(124,106,255,0.1);
  }

  /* MESSAGES */
  .msg-wrap {
    display: flex; width: 100%;
    margin-bottom: 20px;
    animation: fadeUp 0.4s ease;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg-wrap.user { justify-content: flex-end; }
  .msg-wrap.ai { justify-content: flex-start; }

  /* USER BUBBLE */
  .user-bubble {
    max-width: 78%;
    background: var(--user-bg);
    border: 1px solid rgba(124,106,255,0.2);
    border-radius: var(--radius) var(--radius) 4px var(--radius);
    padding: 12px 16px;
    font-size: 14px; line-height: 1.7;
    box-shadow: 0 4px 20px rgba(124,106,255,0.15);
  }

  .user-bubble img {
    max-width: 100%; border-radius: 10px;
    margin-bottom: 8px; display: block;
    border: 1px solid rgba(255,255,255,0.1);
  }

  /* AI BUBBLE */
  .ai-row { display: flex; gap: 10px; max-width: 100%; width: 100%; }

  .ai-avatar {
    width: 32px; height: 32px; flex-shrink: 0;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    box-shadow: 0 0 12px rgba(124,106,255,0.3);
    margin-top: 2px;
  }

  .ai-bubble {
    background: var(--ai-bg);
    border: 1px solid var(--border);
    border-radius: 4px var(--radius) var(--radius) var(--radius);
    padding: 14px 18px;
    font-size: 14px; line-height: 1.8;
    box-shadow: var(--shadow);
    flex: 1; min-width: 0;
    overflow: hidden;
  }

  .ai-bubble .generated-img {
    max-width: 100%; border-radius: 12px;
    border: 1px solid var(--border);
    margin: 8px 0; display: block;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }

  .ai-meta {
    margin-top: 10px; padding-top: 8px;
    border-top: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
    opacity: 0.4;
  }

  .ai-meta span {
    font-size: 9px; font-family: var(--font-code);
    letter-spacing: 0.1em; text-transform: uppercase;
  }

  /* PROSE STYLING */
  .prose { color: var(--text); }
  .prose h1, .prose h2, .prose h3 {
    font-family: var(--font-ui); font-weight: 700;
    margin: 16px 0 8px; color: #fff;
    letter-spacing: -0.3px;
  }
  .prose h1 { font-size: 20px; }
  .prose h2 { font-size: 17px; }
  .prose h3 { font-size: 15px; }
  .prose p { margin-bottom: 10px; }
  .prose ul, .prose ol { padding-left: 20px; margin-bottom: 10px; }
  .prose li { margin-bottom: 4px; }
  .prose strong { color: #fff; font-weight: 600; }
  .prose em { color: var(--accent2); font-style: italic; }
  .prose a { color: var(--accent); text-decoration: none; }
  .prose a:hover { text-decoration: underline; }
  .prose blockquote {
    border-left: 3px solid var(--accent);
    padding-left: 12px; color: var(--text-dim);
    margin: 10px 0;
  }
  .prose code:not(pre code) {
    background: rgba(124,106,255,0.15);
    color: var(--accent2);
    padding: 1px 6px; border-radius: 4px;
    font-family: var(--font-code); font-size: 12px;
  }
  .prose pre {
    background: #0d0d14 !important;
    border: 1px solid var(--border);
    border-radius: 10px;
    margin: 12px 0; overflow: hidden;
    position: relative;
  }
  .code-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 14px;
    background: rgba(255,255,255,0.03);
    border-bottom: 1px solid var(--border);
    font-family: var(--font-code); font-size: 10px;
    color: var(--text-dim); letter-spacing: 0.05em;
  }
  .copy-btn {
    background: none; border: 1px solid var(--border);
    color: var(--text-dim); cursor: pointer;
    padding: 2px 8px; border-radius: 4px; font-size: 10px;
    font-family: var(--font-code); transition: all 0.2s;
  }
  .copy-btn:hover { color: var(--accent2); border-color: var(--accent2); }
  .prose pre code {
    font-family: var(--font-code) !important;
    font-size: 12px !important; line-height: 1.7;
    padding: 14px !important; display: block;
  }

  /* IMAGE PREVIEW */
  #imagePreview {
    display: none;
    margin: 0 16px 8px;
    padding: 8px 12px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    flex-direction: row; align-items: center; gap: 10px;
    flex-shrink: 0;
  }

  #imagePreview.show { display: flex; }

  #previewImg {
    width: 48px; height: 48px; object-fit: cover;
    border-radius: 8px; border: 1px solid var(--border);
  }

  .preview-info { flex: 1; font-size: 11px; color: var(--text-dim); }
  .preview-info strong { color: var(--text); display: block; font-size: 12px; }

  #removeImg {
    background: none; border: none; cursor: pointer;
    color: var(--text-dim); font-size: 16px; padding: 4px;
    transition: color 0.2s;
  }
  #removeImg:hover { color: var(--accent3); }

  /* INPUT AREA */
  #inputArea {
    padding: 12px 16px 20px;
    border-top: 1px solid var(--border);
    background: rgba(10,10,15,0.9);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    flex-shrink: 0;
  }

  .input-box {
    display: flex; align-items: flex-end; gap: 8px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 6px 8px 6px 14px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .input-box:focus-within {
    border-color: rgba(124,106,255,0.4);
    box-shadow: 0 0 0 3px rgba(124,106,255,0.08);
  }

  #userInput {
    flex: 1; background: none; border: none; outline: none;
    color: var(--text); font-family: var(--font-body);
    font-size: 14px; line-height: 1.6;
    resize: none; min-height: 40px; max-height: 160px;
    padding: 8px 0; overflow-y: hidden;
  }

  #userInput::placeholder { color: var(--text-dim); }

  .input-actions {
    display: flex; align-items: center; gap: 4px;
    padding-bottom: 6px;
  }

  .icon-btn {
    width: 34px; height: 34px;
    border-radius: 10px; border: none;
    background: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; color: var(--text-dim);
    transition: all 0.2s;
  }

  .icon-btn:hover { background: rgba(255,255,255,0.07); color: var(--text); }

  .icon-btn.image-mode { color: var(--accent2); background: rgba(0,229,160,0.1); }

  #sendBtn {
    width: 36px; height: 36px;
    border-radius: 10px; border: none;
    background: linear-gradient(135deg, var(--accent), #5f4fd6);
    color: white; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; transition: all 0.2s;
    box-shadow: 0 0 16px rgba(124,106,255,0.3);
    flex-shrink: 0;
  }

  #sendBtn:hover {
    transform: scale(1.05);
    box-shadow: 0 0 24px rgba(124,106,255,0.5);
  }

  #sendBtn:active { transform: scale(0.95); }
  #sendBtn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .input-hint {
    text-align: center; font-size: 10px; color: var(--text-dim);
    margin-top: 8px; font-family: var(--font-code); letter-spacing: 0.03em;
  }

  .input-hint span { color: rgba(124,106,255,0.6); }

  /* MODE SELECTOR */
  .mode-row {
    display: flex; gap: 6px; margin-bottom: 10px;
    overflow-x: auto; padding-bottom: 2px;
  }
  .mode-row::-webkit-scrollbar { display: none; }

  .mode-chip {
    padding: 5px 12px; border-radius: 20px;
    border: 1px solid var(--border);
    background: none; color: var(--text-dim);
    font-size: 11px; font-family: var(--font-code);
    cursor: pointer; transition: all 0.2s;
    white-space: nowrap; flex-shrink: 0;
  }

  .mode-chip.active, .mode-chip:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(124,106,255,0.1);
  }

  .mode-chip.active.img-mode {
    border-color: var(--accent2);
    color: var(--accent2);
    background: rgba(0,229,160,0.1);
  }

  /* LOADER */
  .loader-wrap {
    display: flex; gap: 10px;
    margin-bottom: 20px;
    animation: fadeUp 0.3s ease;
  }

  .loader-avatar {
    width: 32px; height: 32px; flex-shrink: 0;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; margin-top: 2px;
  }

  .loader-body {
    background: var(--ai-bg);
    border: 1px solid var(--border);
    border-radius: 4px var(--radius) var(--radius) var(--radius);
    padding: 14px 18px;
    display: flex; align-items: center; gap: 10px;
  }

  .thinking-dots {
    display: flex; gap: 5px; align-items: center;
  }

  .thinking-dots span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent);
    animation: bounce 1.2s ease-in-out infinite;
  }

  .thinking-dots span:nth-child(2) { animation-delay: 0.2s; background: var(--accent2); }
  .thinking-dots span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-6px); opacity: 1; }
  }

  .thinking-text {
    font-family: var(--font-code); font-size: 11px;
    color: var(--text-dim); letter-spacing: 0.05em;
  }

  /* FILE INPUT */
  #fileInput { display: none; }

  /* HIDDEN */
  .hidden { display: none !important; }

  /* RESPONSIVE */
  @media (max-width: 600px) {
    #app { max-width: 100%; }
    .user-bubble { max-width: 90%; }
    header { padding: 12px 14px; }
    #chatArea { padding: 16px 12px; }
    .welcome h1 { font-size: 22px; }
  }
</style>
</head>
<body>
<div id="app">

  <!-- HEADER -->
  <header>
    <div class="logo">
      <div class="logo-icon">🤖</div>
      <div class="logo-text">Riksan <span>AI</span></div>
    </div>
    <div class="header-badges">
      <div class="badge badge-purple">v5.0 Supreme</div>
      <div class="badge badge-green" id="statusBadge">● Online</div>
    </div>
  </header>

  <!-- CHAT AREA -->
  <div id="chatArea">
    <!-- WELCOME STATE -->
    <div id="welcome" class="welcome">
      <div class="welcome-orb">🧠</div>
      <h1>Riksan AI Supreme</h1>
      <p>AI super pintar — chat, analisis gambar, generate gambar, bantu coding, dan masih banyak lagi. Tanya apa aja!</p>
      <div class="quick-actions">
        <button class="quick-btn" onclick="setQuick('Buatkan gambar kota cyberpunk futuristik')">🎨 Generate Gambar</button>
        <button class="quick-btn" onclick="setQuick('Analisis gambar ini dan jelaskan isinya')">🔍 Analisis Gambar</button>
        <button class="quick-btn" onclick="setQuick('Buatkan REST API dengan Express.js dan JWT auth')">💻 Bantu Coding</button>
        <button class="quick-btn" onclick="setQuick('Jelaskan cara kerja neural network dengan analogi sederhana')">🧪 Jelaskan AI</button>
        <button class="quick-btn" onclick="setQuick('Tulis essay tentang masa depan teknologi blockchain')">✍️ Tulis Konten</button>
        <button class="quick-btn" onclick="setQuick('Hitung ROI investasi 50 juta selama 5 tahun dengan bunga 8%')">📊 Analisis Data</button>
      </div>
    </div>
  </div>

  <!-- IMAGE PREVIEW -->
  <div id="imagePreview">
    <img id="previewImg" src="" alt="preview"/>
    <div class="preview-info">
      <strong>Gambar siap dianalisis</strong>
      Tanya apa aja soal gambar ini
    </div>
    <button id="removeImg" title="Hapus gambar">×</button>
  </div>

  <!-- INPUT AREA -->
  <div id="inputArea">
    <div class="mode-row" id="modeRow">
      <button class="mode-chip active" data-mode="chat" onclick="setMode('chat', this)">💬 Chat</button>
      <button class="mode-chip" data-mode="image" onclick="setMode('image', this)">🎨 Generate Gambar</button>
      <button class="mode-chip" data-mode="code" onclick="setMode('code', this)">💻 Coding</button>
      <button class="mode-chip" data-mode="analyze" onclick="setMode('analyze', this)">🔬 Analisis</button>
      <button class="mode-chip" data-mode="write" onclick="setMode('write', this)">✍️ Nulis</button>
    </div>
    <form id="chatForm" autocomplete="off">
      <div class="input-box">
        <textarea id="userInput" placeholder="Ketik pesan... atau upload gambar untuk dianalisis" rows="1"></textarea>
        <div class="input-actions">
          <button type="button" class="icon-btn" id="cameraBtn" title="Upload Gambar">
            <i class="fas fa-image"></i>
          </button>
          <button type="submit" id="sendBtn">
            <i class="fas fa-paper-plane"></i>
          </button>
        </div>
      </div>
    </form>
    <div class="input-hint">
      <span>Enter</span> kirim · <span>Shift+Enter</span> baris baru · <span>📎</span> upload gambar
    </div>
  </div>

</div>

<input type="file" id="fileInput" accept="image/*"/>

<script src="app.js"></script>
</body>
</html>
